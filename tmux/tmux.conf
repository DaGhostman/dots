# tmux, the zellij way
#
# Modelled after zellij's "unlock-first" preset:
#   * tmux starts LOCKED, every key goes to the app except the Alt shortcuts
#   * Ctrl g unlocks (NORMAL), then pick a mode:
#       p PANE   t TAB   r RESIZE   m MOVE   s SCROLL   o SESSION
#   * Esc / Enter / Ctrl g go back to LOCKED
#   * the status bar is a cheat sheet: it only shows up while unlocked, with the
#     current mode and its keys
#
# Floating panes live in a per-window hidden session shown as a popup, see
# scripts/float.sh

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Morantron/tmux-fingers'

# keep plugins outside of the repo
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# --- Options

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks,xterm-256color:RGB"
set -g allow-passthrough on
set -g set-clipboard on
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
set -g display-time 2000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-keys emacs
set -g set-titles on
set -g set-titles-string "#{?#{m:_float_*,#S},floating,#S} / #W"

# --- Floating panes

set -s command-alias[100] "float-toggle=run-shell -b '~/.config/tmux/scripts/float.sh toggle \"#{client_name}\" \"#{session_name}\" \"#{window_id}\" \"#{pane_id}\" \"#{pane_current_path}\"'"
set -s command-alias[101] "float-embed=run-shell -b '~/.config/tmux/scripts/float.sh embed \"#{client_name}\" \"#{session_name}\" \"#{window_id}\" \"#{pane_id}\" \"#{pane_current_path}\"'"
set -s command-alias[102] "float-fullscreen=run-shell -b '~/.config/tmux/scripts/float.sh fullscreen \"#{client_name}\" \"#{session_name}\"'"
set -g @in_float "#{m:_float_*,#{session_name}}"

set-hook -g window-unlinked "run-shell -b '~/.config/tmux/scripts/float.sh gc'"
set-hook -g session-closed "run-shell -b '~/.config/tmux/scripts/float.sh gc'"

# --- Shared actions
#
# Note: aliases only exist once this file ran, so bind them as plain words or
# quoted strings, never inside { } blocks (those are parsed up front).

# new pane: split the wide way, inside the floating layer open a new float
set -s command-alias[103] 'pane-new=if -F "#{E:@in_float}" { new-window -c "#{pane_current_path}" } { if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" { split-window -h -c "#{pane_current_path}" } { split-window -v -c "#{pane_current_path}" } }'
# grow / shrink in both directions (zellij's Resize Increase / Decrease)
set -s command-alias[104] 'pane-grow=if -F "#{pane_at_right}" { if -F "#{!:#{pane_at_left}}" { resize-pane -t "{left-of}" -L 5 } } { resize-pane -R 5 } ; if -F "#{pane_at_bottom}" { if -F "#{!:#{pane_at_top}}" { resize-pane -t "{up-of}" -U 2 } } { resize-pane -D 2 }'
set -s command-alias[105] 'pane-shrink=if -F "#{pane_at_right}" { if -F "#{!:#{pane_at_left}}" { resize-pane -t "{left-of}" -R 5 } } { resize-pane -L 5 } ; if -F "#{pane_at_bottom}" { if -F "#{!:#{pane_at_top}}" { resize-pane -t "{up-of}" -D 2 } } { resize-pane -U 2 }'

# --- Keybindings
#
# Mode tables: prefix = NORMAL, then PANE, TAB, RESIZE, MOVE, SESSION.
# Bindings ending with `switch-client -T <MODE>` keep you in that mode (like
# hjkl in zellij), everything else drops back to LOCKED. Unbound keys simply
# drop back to LOCKED, which is what Esc and Enter do.

unbind -a -T prefix
unbind C-b

# Ctrl g is a plain binding instead of tmux's prefix, so entering NORMAL can show
# the status line, scripts/status-watch.sh hides it again once LOCKED
set -g prefix None
bind -n C-g { set status on; switch-client -T prefix; run-shell -b '~/.config/tmux/scripts/status-watch.sh "#{client_name}"' }
# and Ctrl g from any mode locks again (unbound keys would fall through to root)
bind -T prefix  C-g set status off
bind -T PANE    C-g set status off
bind -T TAB     C-g set status off
bind -T RESIZE  C-g set status off
bind -T MOVE    C-g set status off
bind -T SESSION C-g set status off

# LOCKED (root): the Alt shortcuts zellij shares between normal & locked

# focus, h/l go to the previous/next tab when at the edge (MoveFocusOrTab)
bind -n M-h     if -F "#{pane_at_left}"  previous-window "select-pane -L"
bind -n M-Left  if -F "#{pane_at_left}"  previous-window "select-pane -L"
bind -n M-l     if -F "#{pane_at_right}" next-window     "select-pane -R"
bind -n M-Right if -F "#{pane_at_right}" next-window     "select-pane -R"
bind -n M-j     select-pane -D
bind -n M-Down  select-pane -D
bind -n M-k     select-pane -U
bind -n M-Up    select-pane -U

bind -n M-n pane-new
bind -n M-f float-toggle

bind -n M-+ pane-grow
bind -n M-= pane-grow
bind -n M-- pane-shrink

bind -n M-[ previous-layout
bind -n M-] next-layout
bind -n M-i swap-window -d -t -1
bind -n M-o swap-window -d -t +1

# NORMAL (prefix)
bind p switch-client -T PANE
bind t switch-client -T TAB
bind r switch-client -T RESIZE
bind m switch-client -T MOVE
bind s copy-mode
bind [ copy-mode
bind o switch-client -T SESSION
bind : command-prompt
bind ? list-keys
bind R { source-file ~/.config/tmux/tmux.conf; display "config reloaded" }
bind C-q confirm-before -p "Quit session #S? (y/n)" kill-session

# PANE
bind -T PANE h     { select-pane -L; switch-client -T PANE }
bind -T PANE Left  { select-pane -L; switch-client -T PANE }
bind -T PANE j     { select-pane -D; switch-client -T PANE }
bind -T PANE Down  { select-pane -D; switch-client -T PANE }
bind -T PANE k     { select-pane -U; switch-client -T PANE }
bind -T PANE Up    { select-pane -U; switch-client -T PANE }
bind -T PANE l     { select-pane -R; switch-client -T PANE }
bind -T PANE Right { select-pane -R; switch-client -T PANE }
bind -T PANE Tab   { select-pane -t :.+; switch-client -T PANE }
bind -T PANE \;    last-pane
bind -T PANE n pane-new
bind -T PANE d split-window -v -c "#{pane_current_path}"
bind -T PANE r split-window -h -c "#{pane_current_path}"
bind -T PANE x kill-pane
bind -T PANE f if -F "#{E:@in_float}" float-fullscreen "resize-pane -Z"
bind -T PANE e float-embed
bind -T PANE w float-toggle
bind -T PANE z if -F "#{==:#{pane-border-status},off}" { setw pane-border-status top } { setw pane-border-status off }
bind -T PANE c command-prompt -I "#{pane_title}" -p "pane name:" { select-pane -T "%%"; setw pane-border-status top }
bind -T PANE p switch-client -T prefix

# TAB
bind -T TAB h     { previous-window; switch-client -T TAB }
bind -T TAB Left  { previous-window; switch-client -T TAB }
bind -T TAB k     { previous-window; switch-client -T TAB }
bind -T TAB Up    { previous-window; switch-client -T TAB }
bind -T TAB l     { next-window; switch-client -T TAB }
bind -T TAB Right { next-window; switch-client -T TAB }
bind -T TAB j     { next-window; switch-client -T TAB }
bind -T TAB Down  { next-window; switch-client -T TAB }
bind -T TAB Tab   last-window
bind -T TAB 1 select-window -t :=1
bind -T TAB 2 select-window -t :=2
bind -T TAB 3 select-window -t :=3
bind -T TAB 4 select-window -t :=4
bind -T TAB 5 select-window -t :=5
bind -T TAB 6 select-window -t :=6
bind -T TAB 7 select-window -t :=7
bind -T TAB 8 select-window -t :=8
bind -T TAB 9 select-window -t :=9
bind -T TAB n new-window -c "#{pane_current_path}"
bind -T TAB x kill-window
bind -T TAB r command-prompt -I "#W" -p "tab name:" { rename-window "%%" }
bind -T TAB s setw synchronize-panes
bind -T TAB b break-pane
# move the pane to the tab on the left / right, a new tab when there is none
bind -T TAB [ if -F "#{window_start_flag}" { if -F "#{e|>:#{window_panes},1}" { break-pane -b } } { join-pane -h -t :-1 }
bind -T TAB ] if -F "#{window_end_flag}" { if -F "#{e|>:#{window_panes},1}" { break-pane -a } } { join-pane -h -t :+1 }
bind -T TAB t switch-client -T prefix

# RESIZE: hjkl grow towards that side, HJKL shrink from that side
bind -T RESIZE h     { if -F "#{!:#{pane_at_left}}" { resize-pane -t "{left-of}" -L 5 }; switch-client -T RESIZE }
bind -T RESIZE Left  { if -F "#{!:#{pane_at_left}}" { resize-pane -t "{left-of}" -L 5 }; switch-client -T RESIZE }
bind -T RESIZE l     { if -F "#{!:#{pane_at_right}}" { resize-pane -R 5 }; switch-client -T RESIZE }
bind -T RESIZE Right { if -F "#{!:#{pane_at_right}}" { resize-pane -R 5 }; switch-client -T RESIZE }
bind -T RESIZE k     { if -F "#{!:#{pane_at_top}}" { resize-pane -t "{up-of}" -U 2 }; switch-client -T RESIZE }
bind -T RESIZE Up    { if -F "#{!:#{pane_at_top}}" { resize-pane -t "{up-of}" -U 2 }; switch-client -T RESIZE }
bind -T RESIZE j     { if -F "#{!:#{pane_at_bottom}}" { resize-pane -D 2 }; switch-client -T RESIZE }
bind -T RESIZE Down  { if -F "#{!:#{pane_at_bottom}}" { resize-pane -D 2 }; switch-client -T RESIZE }
bind -T RESIZE H     { if -F "#{!:#{pane_at_left}}" { resize-pane -t "{left-of}" -R 5 }; switch-client -T RESIZE }
bind -T RESIZE L     { if -F "#{!:#{pane_at_right}}" { resize-pane -L 5 }; switch-client -T RESIZE }
bind -T RESIZE K     { if -F "#{!:#{pane_at_top}}" { resize-pane -t "{up-of}" -D 2 }; switch-client -T RESIZE }
bind -T RESIZE J     { if -F "#{!:#{pane_at_bottom}}" { resize-pane -U 2 }; switch-client -T RESIZE }
bind -T RESIZE + "pane-grow ; switch-client -T RESIZE"
bind -T RESIZE = "pane-grow ; switch-client -T RESIZE"
bind -T RESIZE - "pane-shrink ; switch-client -T RESIZE"
bind -T RESIZE r switch-client -T prefix

# MOVE: swap the pane with its neighbour
bind -T MOVE h     { swap-pane -d -t "{left-of}";  switch-client -T MOVE }
bind -T MOVE Left  { swap-pane -d -t "{left-of}";  switch-client -T MOVE }
bind -T MOVE l     { swap-pane -d -t "{right-of}"; switch-client -T MOVE }
bind -T MOVE Right { swap-pane -d -t "{right-of}"; switch-client -T MOVE }
bind -T MOVE k     { swap-pane -d -t "{up-of}";    switch-client -T MOVE }
bind -T MOVE Up    { swap-pane -d -t "{up-of}";    switch-client -T MOVE }
bind -T MOVE j     { swap-pane -d -t "{down-of}";  switch-client -T MOVE }
bind -T MOVE Down  { swap-pane -d -t "{down-of}";  switch-client -T MOVE }
bind -T MOVE n     { swap-pane -D; switch-client -T MOVE }
bind -T MOVE Tab   { swap-pane -D; switch-client -T MOVE }
bind -T MOVE p     { swap-pane -U; switch-client -T MOVE }
bind -T MOVE m switch-client -T prefix

# SESSION
bind -T SESSION d detach-client
bind -T SESSION w choose-tree -Zs -f "#{?#{m:_float_*,#{session_name}},0,1}"
bind -T SESSION n command-prompt -p "new session:" { new-session -s "%%" -c "#{pane_current_path}" }
bind -T SESSION r command-prompt -I "#S" -p "session name:" { rename-session "%%" }
bind -T SESSION c display-popup -E -w 90% -h 90% -b rounded -d ~/.config/tmux '${EDITOR:-nvim} tmux.conf'
bind -T SESSION o switch-client -T prefix

# SCROLL (copy mode, vi keys plus zellij's scroll/search keys)
bind -T copy-mode-vi Escape if -F "#{selection_present}" { send -X clear-selection } { send -X cancel }
bind -T copy-mode-vi C-c    send -X cancel
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi d      send -X halfpage-down
bind -T copy-mode-vi u      send -X halfpage-up
bind -T copy-mode-vi f      command-prompt -T search -p "(search up)" { send -X search-backward "%%" }
bind -T copy-mode-vi p      send -X search-reverse
bind -T copy-mode-vi [      send -X previous-prompt
bind -T copy-mode-vi ]      send -X next-prompt
bind -T copy-mode-vi e      { send -X cancel; run-shell -b '~/.config/tmux/scripts/edit-scrollback.sh "#{client_name}" "#{pane_id}"' }

# --- Look (gruvbox dark, needs a Nerd Font, ghostty ships the symbols)

set -g status off
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#ebdbb2"
set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g message-command-style "bg=#3c3836,fg=#fabd2f"
set -g mode-style "bg=#504945,fg=#fabd2f"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#b8bb26"
set -g pane-border-lines single
set -g pane-border-format " #{pane_index} #{pane_title} "
set -g popup-border-lines rounded
set -g popup-border-style "fg=#fabd2f"

# mode name, icon & colour, LOCKED is the root table, NORMAL the prefix table
set -g @mode "#{?pane_in_mode, SCROLL,#{?#{==:#{client_key_table},root}, LOCKED,#{?#{==:#{client_key_table},prefix}, NORMAL,#{?#{==:#{client_key_table},PANE}, PANE,#{?#{==:#{client_key_table},TAB}, TAB,#{?#{==:#{client_key_table},RESIZE}, RESIZE,#{?#{==:#{client_key_table},MOVE}, MOVE, SESSION}}}}}}}"
set -g @mode_colour "#{?pane_in_mode,##fabd2f,#{?#{==:#{client_key_table},root},##a89984,#{?#{==:#{client_key_table},prefix},##83a598,#{?#{==:#{client_key_table},PANE},##b8bb26,#{?#{==:#{client_key_table},TAB},##fe8019,#{?#{==:#{client_key_table},RESIZE},##d3869b,#{?#{==:#{client_key_table},MOVE},##8ec07c,##fb4934}}}}}}}"

# key hints of the current mode, shown on the right like zellij's status-bar
set -g @hint_LOCKED  "#[fg=#fabd2f]#[bold]C-g#[nobold]#[fg=#a89984] unlock  #[fg=#fabd2f]#[bold]M-hjkl#[nobold]#[fg=#a89984] focus  #[fg=#fabd2f]#[bold]M-n#[nobold]#[fg=#a89984] new pane  #[fg=#fabd2f]#[bold]M-f#[nobold]#[fg=#a89984] floats"
set -g @hint_NORMAL  "#[fg=#fabd2f]#[bold]p#[nobold]#[fg=#a89984] pane  #[fg=#fabd2f]#[bold]t#[nobold]#[fg=#a89984] tab  #[fg=#fabd2f]#[bold]r#[nobold]#[fg=#a89984] resize  #[fg=#fabd2f]#[bold]m#[nobold]#[fg=#a89984] move  #[fg=#fabd2f]#[bold]s#[nobold]#[fg=#a89984] scroll  #[fg=#fabd2f]#[bold]o#[nobold]#[fg=#a89984] session  #[fg=#fabd2f]#[bold]C-q#[nobold]#[fg=#a89984] quit  #[fg=#fabd2f]#[bold]esc#[nobold]#[fg=#a89984] lock"
set -g @hint_PANE    "#[fg=#fabd2f]#[bold]hjkl#[nobold]#[fg=#a89984] focus  #[fg=#fabd2f]#[bold]n#[nobold]#[fg=#a89984] new  #[fg=#fabd2f]#[bold]d#[nobold]#[fg=#a89984] down  #[fg=#fabd2f]#[bold]r#[nobold]#[fg=#a89984] right  #[fg=#fabd2f]#[bold]x#[nobold]#[fg=#a89984] close  #[fg=#fabd2f]#[bold]f#[nobold]#[fg=#a89984] full  #[fg=#fabd2f]#[bold]e#[nobold]#[fg=#a89984] float/embed  #[fg=#fabd2f]#[bold]w#[nobold]#[fg=#a89984] floats  #[fg=#fabd2f]#[bold]c#[nobold]#[fg=#a89984] name  #[fg=#fabd2f]#[bold]z#[nobold]#[fg=#a89984] frames"
set -g @hint_TAB     "#[fg=#fabd2f]#[bold]hjkl#[nobold]#[fg=#a89984] switch  #[fg=#fabd2f]#[bold]1-9#[nobold]#[fg=#a89984] go  #[fg=#fabd2f]#[bold]n#[nobold]#[fg=#a89984] new  #[fg=#fabd2f]#[bold]x#[nobold]#[fg=#a89984] close  #[fg=#fabd2f]#[bold]r#[nobold]#[fg=#a89984] rename  #[fg=#fabd2f]#[bold]b#[nobold]#[fg=#a89984] break  #[fg=#fabd2f]#[bold][ ]#[nobold]#[fg=#a89984] pane to tab  #[fg=#fabd2f]#[bold]s#[nobold]#[fg=#a89984] sync"
set -g @hint_RESIZE  "#[fg=#fabd2f]#[bold]hjkl#[nobold]#[fg=#a89984] grow  #[fg=#fabd2f]#[bold]HJKL#[nobold]#[fg=#a89984] shrink  #[fg=#fabd2f]#[bold]+ -#[nobold]#[fg=#a89984] size"
set -g @hint_MOVE    "#[fg=#fabd2f]#[bold]hjkl#[nobold]#[fg=#a89984] swap  #[fg=#fabd2f]#[bold]n/tab#[nobold]#[fg=#a89984] next  #[fg=#fabd2f]#[bold]p#[nobold]#[fg=#a89984] prev"
set -g @hint_SESSION "#[fg=#fabd2f]#[bold]d#[nobold]#[fg=#a89984] detach  #[fg=#fabd2f]#[bold]w#[nobold]#[fg=#a89984] sessions  #[fg=#fabd2f]#[bold]n#[nobold]#[fg=#a89984] new  #[fg=#fabd2f]#[bold]r#[nobold]#[fg=#a89984] rename  #[fg=#fabd2f]#[bold]c#[nobold]#[fg=#a89984] config"
set -g @hint_SCROLL  "#[fg=#fabd2f]#[bold]jk#[nobold]#[fg=#a89984] scroll  #[fg=#fabd2f]#[bold]d/u#[nobold]#[fg=#a89984] half page  #[fg=#fabd2f]#[bold]f#[nobold]#[fg=#a89984] search  #[fg=#fabd2f]#[bold]n/p#[nobold]#[fg=#a89984] next/prev  #[fg=#fabd2f]#[bold][ ]#[nobold]#[fg=#a89984] prompts  #[fg=#fabd2f]#[bold]v#[nobold]#[fg=#a89984] select  #[fg=#fabd2f]#[bold]y#[nobold]#[fg=#a89984] copy  #[fg=#fabd2f]#[bold]e#[nobold]#[fg=#a89984] edit  #[fg=#fabd2f]#[bold]esc#[nobold]#[fg=#a89984] exit"
set -g @hint "#{?pane_in_mode,#{@hint_SCROLL},#{?#{==:#{client_key_table},root},#{@hint_LOCKED},#{?#{==:#{client_key_table},prefix},#{@hint_NORMAL},#{?#{==:#{client_key_table},PANE},#{@hint_PANE},#{?#{==:#{client_key_table},TAB},#{@hint_TAB},#{?#{==:#{client_key_table},RESIZE},#{@hint_RESIZE},#{?#{==:#{client_key_table},MOVE},#{@hint_MOVE},#{@hint_SESSION}}}}}}}}"

#   mode    session    1 tab    2 tab                 key hints
set -g status-left-length 60
set -g status-right-length 200
set -g status-left "#[fg=#{E:@mode_colour},bg=default]#[fg=#282828,bg=#{E:@mode_colour},bold]#{E:@mode}#[fg=#{E:@mode_colour},bg=default,nobold] #[fg=#3c3836]#[fg=#ebdbb2,bg=#3c3836]#{?#{E:@in_float}, floating, #S}#[fg=#3c3836,bg=default] "
set -g status-right "#{E:@hint} "
set -g window-status-separator " "
set -g window-status-format "#[fg=#3c3836,bg=default]#[fg=#a89984,bg=#3c3836]#I #W#{?window_zoomed_flag, ,}#{?@float, ,}#{?pane_synchronized, ,}#[fg=#3c3836,bg=default]"
set -g window-status-current-format "#[fg=#fabd2f,bg=default]#[fg=#282828,bg=#fabd2f,bold]#I #W#{?window_zoomed_flag, ,}#{?@float, ,}#{?pane_synchronized, ,}#[fg=#fabd2f,bg=default,nobold]"

if "test -x ~/.tmux/plugins/tpm/tpm" "run ~/.tmux/plugins/tpm/tpm"
